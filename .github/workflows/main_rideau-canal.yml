# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - rideau-canal

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install dependencies and build Angular app
        run: |
          npm install
          npm run build
          npm prune --omit=dev

      - name: Package deployment artifacts
        run: |
          New-Item -ItemType Directory -Force -Path deploy-output
          Copy-Item -Recurse dist deploy-output\dist
          Copy-Item -Recurse node_modules deploy-output\node_modules
          Copy-Item server.js deploy-output\server.js
          Copy-Item package.json deploy-output\package.json
          Copy-Item package-lock.json deploy-output\package-lock.json
          Copy-Item web.config deploy-output\web.config

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy-output/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E99AB991668C42FE902398E7ABCC6B79 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_777EC8039ED8474895DFE93BFC7EF344 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3BD5B8C5FFCB439D947EF48529F3814E }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'rideau-canal'
          slot-name: 'Production'
          package: .
          